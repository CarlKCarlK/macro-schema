name: CI

"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  # The UI tests compare rustc's error messages exactly, and docs.rs builds with the newest
  # nightly, so a new Rust release can break either without any change here. The weekly run
  # reports that before the next release does.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# A pull request from a branch in this repository already has the push run, so the
# duplicate `pull_request` run is skipped; a pull request from a fork runs.

jobs:
  test:
    name: fmt, clippy, test
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the fixtures, the trybuild UI tests, and the README checks.
      - name: Test
        run: cargo test --workspace

  msrv:
    name: MSRV (1.93)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      # Build only: the UI tests' expected messages follow the current stable rustc.
      - name: Check
        run: cargo check --workspace --all-targets

  docs-rs:
    name: docs.rs
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Build the docs as docs.rs does
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
          DOCS_RS: "1"
        run: |
          for crate in macro-schema macro-schema-core macro-schema-derive; do
            cargo doc --no-deps -p "$crate"
          done

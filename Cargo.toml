[package]
name = "const-structures"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Named-field, schema-checked declarations of compile-time constant structures."
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
trybuild = "1.0.121"
